<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Geometry Place</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/styles.css" />
<script src="/js/devconsole.js"></script>
</head>
<body>

  <header class="app-header">
    <img class="app-header__logo" src="/assets/logo/Geometry Place.png" alt="Geometry Place" />
    <div class="app-header__spacer"></div>

    <button class="btn" id="test-nav-btn">Test</button>
    <button class="btn" id="admin-nav-btn" style="display:none">Admin</button>

    <div class="app-header__account">
      <span class="app-header__username" id="username-label"></span>
      <img class="app-header__account-icon" id="account-icon" alt="" />
    </div>

    <button class="btn" id="logout-btn">Salir</button>
  </header>

  <!-- ===================== Vista: Contador ===================== -->
  <section class="view countdown-view" id="view-countdown">
    <div class="user-ticker" id="ticker-left">
      <div class="user-ticker__track"></div>
    </div>

    <div class="countdown-view__center">
      <div id="countdown"></div>
      <p class="countdown-view__waiting" id="countdown-waiting-text"></p>
    </div>

    <div class="user-ticker user-ticker--reverse" id="ticker-right">
      <div class="user-ticker__track"></div>
    </div>
  </section>

  <!-- ===================== Vista: Encuesta de modo ===================== -->
  <section class="view view--hidden vote-view" id="view-vote">
    <div class="vote-view__card">
      <h2>¿Cómo va a ser el nivel?</h2>
      <p class="vote-view__timer">Termina en <span id="vote-timer">--:--</span></p>

      <div class="vote-view__options">
        <button class="vote-option" id="vote-classic-btn">
          <strong>Clásico</strong>
          <span>Canvas 1920×1080</span>
          <span class="vote-option__count"><span id="vote-count-classic">0</span> votos</span>
        </button>
        <button class="vote-option" id="vote-platformer-btn">
          <strong>Plataforma</strong>
          <span>Canvas 1026×1026</span>
          <span class="vote-option__count"><span id="vote-count-platformer">0</span> votos</span>
        </button>
      </div>

      <p class="vote-view__hint" id="vote-my-choice"></p>
    </div>
  </section>

  <!-- ===================== Vista: Canvas ===================== -->
  <section class="view view--hidden" id="view-canvas">
    <div class="canvas-topbar">
      <div class="canvas-zoom">
        <button class="icon-btn" id="zoom-out-btn">−</button>
        <button class="icon-btn" id="zoom-in-btn">+</button>
      </div>
      <span>🟢 Conectados: <strong id="online-count">0</strong></span>
    </div>

    <div class="gd-canvas-viewport" id="gd-canvas-viewport">
      <div class="gd-canvas" id="gd-canvas"></div>
    </div>

    <div class="canvas-bottombar">
      <div class="mode-switch" id="mode-switch">
        <button class="mode-switch__btn mode-switch__btn--active" data-mode="build">Build</button>
        <button class="mode-switch__btn" data-mode="edit">Edit</button>
        <button class="mode-switch__btn" data-mode="delete">Delete</button>
      </div>

      <div class="tools-panel">
        <div class="tools-panel__tabs" id="tools-tabs"></div>
        <div class="tools-panel__grid" id="tools-grid"></div>
      </div>

      <div class="cooldown-display">
        <span class="cooldown-display__label" id="cooldown-label">PLACE</span>
        <span class="cooldown-display__time" id="cooldown-time">00:00</span>
      </div>
    </div>
  </section>

  <!-- ===================== Vista: Admin ===================== -->
  <section class="view view--hidden" id="view-admin">
    <div class="admin-panel">
      <button class="btn" id="admin-back-btn">← Volver</button>
      <h2>Panel de administración</h2>

      <div class="admin-actions">
        <input type="datetime-local" id="schedule-date" />
        <button class="btn" id="schedule-event-btn">Programar inicio del contador</button>
        <button class="btn" id="finish-event-btn">Forzar fin del evento</button>
        <span id="event-status"></span>
      </div>

      <h3>Usuarios</h3>
      <table>
        <thead>
          <tr><th>Usuario</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acción</th></tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </div>
  </section>

  <!-- ===================== Vista: Test (temporal, quitar antes de publicar) ===================== -->
  <section class="view view--hidden" id="view-test">
    <div class="admin-panel">
      <button class="btn" id="test-back-btn">← Volver</button>
      <h2>Panel de testeo</h2>

      <h3>1. Probar el contador con una fecha a medida</h3>
      <input type="datetime-local" id="test-date" />
      <button class="btn" id="test-countdown-btn">Probar contador</button>
      <div id="test-countdown-container"></div>

      <h3>2. Probar endpoints del Worker</h3>
      <button class="btn" id="ping-worker-btn">Ping /api/event/state</button>
      <pre id="ping-result" style="white-space:pre-wrap;background:#0f1830;padding:10px;border-radius:6px"></pre>

      <h3>3. Comprobar sesión actual</h3>
      <button class="btn" id="check-session-btn">Comprobar /api/auth/me</button>
      <pre id="session-result" style="white-space:pre-wrap;background:#0f1830;padding:10px;border-radius:6px"></pre>
    </div>
  </section>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
