<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Geometry Place — Testeo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <img class="site-header__logo" src="/assets/logo/Geometry Place.png" alt="Geometry Place" />
    <span>Geometry Place — Panel de testeo</span>
  </header>

  <div class="admin-panel">
    <h2>1. Probar el contador con una fecha a medida</h2>
    <input type="datetime-local" id="test-date" />
    <button class="btn" id="test-countdown-btn">Probar contador</button>
    <div id="test-countdown-container"></div>

    <h2>2. Probar endpoints del Worker</h2>
    <button class="btn" id="ping-worker-btn">Ping /api/event/state</button>
    <pre id="ping-result" style="white-space:pre-wrap;background:#0f1830;padding:10px;border-radius:6px"></pre>

    <h2>3. Comprobar sesión actual</h2>
    <button class="btn" id="check-session-btn">Comprobar /api/auth/me</button>
    <pre id="session-result" style="white-space:pre-wrap;background:#0f1830;padding:10px;border-radius:6px"></pre>
  </div>

  <script type="module">
    import { CONFIG } from "/js/config.js";
    import { Countdown } from "/js/countdown.js";
    import { getToken } from "/js/auth.js";

    document.getElementById("test-countdown-btn").addEventListener("click", () => {
      const val = document.getElementById("test-date").value;
      if (!val) return alert("Elige una fecha primero");
      const container = document.getElementById("test-countdown-container");
      new Countdown(container, new Date(val).toISOString());
    });

    document.getElementById("ping-worker-btn").addEventListener("click", async () => {
      const out = document.getElementById("ping-result");
      out.textContent = "Cargando…";
      try {
        const res = await fetch(`${CONFIG.WORKER_URL}/api/event/state`);
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (err) {
        out.textContent = "Error: " + err.message;
      }
    });

    document.getElementById("check-session-btn").addEventListener("click", async () => {
      const out = document.getElementById("session-result");
      out.textContent = "Cargando…";
      try {
        const res = await fetch(`${CONFIG.WORKER_URL}/api/auth/me`, {
          headers: { Authorization: `Bearer ${getToken() || ""}` },
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (err) {
        out.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
