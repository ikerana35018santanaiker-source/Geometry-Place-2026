<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Geometry Place — Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <img class="site-header__logo" src="/assets/logo/Geometry Place.png" alt="Geometry Place" />
    <span>Geometry Place</span>
    <div class="site-header__spacer"></div>
    <span id="user-label"></span>
    <button class="btn" id="logout-btn">Salir</button>
  </header>

  <div id="countdown"></div>

  <div class="status-bar">
    <span>🟢 Conectados: <strong id="online-count">0</strong></span>
  </div>

  <div class="gd-canvas-wrap">
    <div class="gd-canvas" id="gd-canvas"></div>
    <div class="object-selector" id="object-selector"></div>
  </div>

  <script type="module" src="/js/canvas.js"></script>
</body>
</html>
